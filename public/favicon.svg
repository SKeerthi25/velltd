<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="scaffoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="paintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40" />
      <stop offset="100%" stop-color="#FF7A1A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B1F3A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded pill/shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#0B1F3A" />

  <!-- Scaffolding Frame / Ladder Uprights (left & right bars) -->
  <rect x="24" y="24" width="7" height="72" rx="3.5" fill="#38BDF8" opacity="0.9" />
  <rect x="89" y="24" width="7" height="72" rx="3.5" fill="#38BDF8" opacity="0.9" />

  <!-- Scaffolding Ledger / Cross Braces -->
  <line x1="28" y1="36" x2="92" y2="36" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="28" y1="62" x2="92" y2="62" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="28" y1="88" x2="92" y2="88" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round" />
  <!-- Diagonal scaffold brace -->
  <line x1="31" y1="38" x2="89" y2="86" stroke="#64748B" stroke-width="3" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Paint Roller Head (Diagonal Dynamic Stroke) -->
  <g transform="rotate(-15 60 52)">
    <!-- Roller cylinder -->
    <rect x="36" y="26" width="48" height="20" rx="8" fill="url(#paintGrad)" filter="url(#shadow)" />
    <!-- Fresh paint wet stripe -->
    <path d="M 40 32 Q 52 38 64 32 T 80 34" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    
    <!-- Metal Arm & Handle -->
    <path d="M 60 46 L 60 56 Q 60 62 68 62 L 72 62" fill="none" stroke="#CBD5E1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Handle grip -->
    <rect x="70" y="58" width="22" height="8" rx="4" fill="#FF7A1A" />
  </g>

  <!-- Stylized "V" / Spark Accent -->
  <circle cx="95" cy="24" r="5" fill="#FF7A1A" />
  <circle cx="25" cy="95" r="4" fill="#38BDF8" />
</svg>
